# ========================================
# 配置说明
# ========================================

# ASR 提供商选择:
# - tencent: 腾讯云语音识别 (适合中文，高质量)
# - openai_whisper: OpenAI Whisper (多语言支持，准确度高)
# - http: 自定义 HTTP ASR 服务 (灵活集成)

# LLM 提供商类型:
# - openai: OpenAI 官方 API
# - openai-compatible: OpenAI 兼容接口 (如 Azure OpenAI, 本地部署模型等)

# 音频参数调优建议:
# - silence_duration: 增加此值可减少误判断为结束的情况
# - silence_threshold: 降低此值可提高静音检测灵敏度
# - chunk_duration: 通常保持 100ms，不建议修改

# 日志级别:
# - debug: 详细调试信息 (开发环境)
# - info: 常规运行信息 (生产环境推荐)
# - warn: 警告信息
# - error: 仅错误信息

# 环境变量覆盖示例:
# export INTERVIEW_AI_ASR__TENCENT__SECRET_ID="your_secret_id"
# export INTERVIEW_AI_LLM__PROVIDERS__OPENAI__API_KEY="your_api_key"
# export INTERVIEW_AI_LOGGING__LEVEL="debug"
