# AI Interview Assistant Configuration Example
# 配置示例文件 - 包含常见使用场景的配置示例

# ========================================
# 场景 1: 使用腾讯云 ASR + OpenAI GPT-4
# ========================================

app:
  name: interview-ai
  environment: production

audio:
  sample_rate: 16000
  chunk_duration: 100ms
  max_buffer: 10s
  silence_duration: 800ms
  silence_threshold: 0.2
  queue_size: 20
  default_channels: 1
  device_hints:
    speaker_keywords:
      - blackhole
      - loopback
      - virtual
      - aggregate
    microphone_keywords:
      - microphone
      - built-in
      - usb

pipeline:
  max_consecutive_errors: 5
  stats_interval: 30s

asr:
  active: tencent

  tencent:
    secret_id: "YOUR_TENCENT_SECRET_ID"
    secret_key: "YOUR_TENCENT_SECRET_KEY"
    app_id: "YOUR_APP_ID"
    region: ap-shanghai
    engine_model_type: 16k_zh

llm:
  active: openai
  system_prompt: "你是一个专业的面试助手，需要帮助候选人生成结构化、专业的回答。请根据面试问题提供清晰、有条理的建议。"
  context_messages: 3  # 发送给AI的历史对话条数 (0-10, 建议3-5)

  providers:
    openai:
      kind: openai
      api_key: "YOUR_OPENAI_API_KEY"
      model: gpt-4
      base_url: https://api.openai.com/v1
      temperature: 0.7
      max_tokens: 2000

cli:
  enable_hotkey: true
  hotkey: ctrl+v

gui:
  auto_start_asr: false
  width: 1400
  height: 800

logging:
  level: info
  encoding: console
  development: false

